version: '3.8'

services:
  web:
    build: .
    container_name: flask-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=Actividad
      - DB_USER=root
      - DB_PASSWORD=J0n1cr1b3/
      - DB_NAME=actividad-E2
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: servidor-bd
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: J0n1cr1b3/
      MYSQL_DATABASE: actividad-E2
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: